<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Timer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main id="app" class="mx-auto flex min-h-screen w-full max-w-6xl flex-col items-center justify-center px-6 py-8">
    <!-- Top bar -->
    <header class="w-full text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-slate-400">Classroom Timer</p>
    </header>

    <!-- Timer stage: Step 4 will hook visual alerts onto this wrapper -->
    <section id="timer-stage" class="mt-6 flex w-full flex-col items-center rounded-3xl border border-slate-800 bg-slate-900/60 px-6 py-8 shadow-2xl sm:px-10">
      <!-- Current task label -->
      <label for="task-label" class="text-sm font-semibold uppercase tracking-[0.25em] text-slate-400">Current task</label>
      <input
        id="task-label"
        type="text"
        value=""
        placeholder="Type the current task…"
        autocomplete="off"
        class="mt-3 w-full max-w-3xl border-b-2 border-slate-700 bg-transparent px-2 pb-2 text-center text-3xl font-semibold text-white placeholder:text-slate-600 focus:border-sky-400 focus:outline-none md:text-4xl"
      />

      <!-- Big countdown display (static placeholder, no JS yet) -->
      <div
        id="countdown-display"
        role="timer"
        aria-live="off"
        class="mt-4 font-mono text-[18vh] font-bold leading-none tracking-tight text-white tabular-nums select-none"
      >10:00</div>

      <p class="mt-2 text-sm uppercase tracking-[0.25em] text-slate-500">minutes : seconds</p>
    </section>

    <!-- Setup + controls -->
    <section class="mt-6 grid w-full gap-4 lg:grid-cols-[1fr_auto] lg:items-stretch">
      <!-- Duration input -->
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 sm:p-6">
        <h2 class="text-sm font-semibold uppercase tracking-[0.25em] text-slate-400">Duration</h2>
        <div class="mt-4 flex flex-wrap items-end justify-center gap-4 sm:gap-6">
          <div class="flex items-end gap-3">
            <div>
              <label for="duration-minutes" class="block text-center text-xs font-semibold uppercase tracking-widest text-slate-400">Min</label>
              <input
                id="duration-minutes"
                type="number"
                min="0"
                max="999"
                value="10"
                inputmode="numeric"
                class="mt-2 w-28 rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-center text-3xl font-bold tabular-nums text-white focus:border-sky-400 focus:outline-none"
              />
            </div>
            <span aria-hidden="true" class="pb-3 text-3xl font-bold text-slate-600">:</span>
            <div>
              <label for="duration-seconds" class="block text-center text-xs font-semibold uppercase tracking-widest text-slate-400">Sec</label>
              <input
                id="duration-seconds"
                type="number"
                min="0"
                max="59"
                value="0"
                inputmode="numeric"
                class="mt-2 w-28 rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-center text-3xl font-bold tabular-nums text-white focus:border-sky-400 focus:outline-none"
              />
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3">
            <span class="w-full text-center text-xs font-semibold uppercase tracking-widest text-slate-500 sm:w-auto">Quick set</span>
            <button id="preset-5m" type="button" class="rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-lg font-semibold text-slate-100 hover:bg-slate-700">5 min</button>
            <button id="preset-10m" type="button" class="rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-lg font-semibold text-slate-100 hover:bg-slate-700">10 min</button>
            <button id="preset-15m" type="button" class="rounded-xl border border-slate-700 bg-slate-800 px-4 py-2.5 text-lg font-semibold text-slate-100 hover:bg-slate-700">15 min</button>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5 sm:p-6">
        <h2 class="text-center text-sm font-semibold uppercase tracking-[0.25em] text-slate-400">Controls</h2>
        <div class="mt-4 flex flex-wrap items-center justify-center gap-3 sm:gap-4">
          <button id="btn-start" type="button" class="min-w-32 rounded-2xl bg-emerald-500 px-8 py-4 text-xl font-bold text-slate-950 hover:bg-emerald-400 active:bg-emerald-600">Start</button>
          <button id="btn-pause" type="button" class="min-w-32 rounded-2xl bg-amber-400 px-8 py-4 text-xl font-bold text-slate-950 hover:bg-amber-300 active:bg-amber-500">Pause</button>
          <button id="btn-reset" type="button" class="min-w-32 rounded-2xl bg-rose-600 px-8 py-4 text-xl font-bold text-white hover:bg-rose-500 active:bg-rose-700">Reset</button>
        </div>
      </div>
    </section>

    <footer class="mt-6 text-center text-sm text-slate-500">Set a duration, then Start. Refreshing the page resets everything.</footer>
  </main>
</body>
</html>
